services:
  visualsubnetcalc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visualsubnetcalc
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
